services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aifitguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aifitguard}
      POSTGRES_DB: ${POSTGRES_DB:-aifitguard}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - aifitguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - aifitguard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - aifitguard_uploads:/app/instance/uploads
    expose:
      - "5000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  aifitguard_postgres_data:
  aifitguard_redis_data:
  aifitguard_uploads:
  caddy_data:
  caddy_config:
